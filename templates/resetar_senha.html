<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Nova Senha - 📒 Chronos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
</head>

<body>

    <div class="auth-wrapper">
        <h1 class="logo" style="font-size: 2rem; margin-bottom: 20px;">📒 Chronos</h1>

        <div class="new-post-card" style="width: 100%; max-width: 400px; padding: 40px;">
            <h2 class="auth-title">Criar Nova Senha</h2>

            <p style="color: #666; margin-bottom: 20px; font-size: 0.95rem;">
                Quase lá! Escolha uma nova senha forte para a sua conta.
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form action="{{ url_for('resetar_senha', token=token) }}" method="POST">

                <label for="password" style="display:block; margin-bottom:5px; color:#666;">Nova Senha</label>
                <input type="password" id="password" name="password" placeholder="********" required>

                <label for="confirm_password"
                    style="display:block; margin-bottom:5px; color:#666; margin-top: 15px;">Confirmar Nova Senha</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="********" required>

                <button type="submit" style="width: 100%; margin-top: 20px;">Salvar e Entrar</button>
            </form>
        </div>
    </div>

</body>

</html>
