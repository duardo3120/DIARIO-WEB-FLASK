<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 📒 Chronos</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
    <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
</head>
<body>

    <div class="auth-wrapper">
        <h1 class="logo" style="font-size: 2rem; margin-bottom: 20px;">📒 Chronos</h1>

        <div class="new-post-card" style="width: 100%; max-width: 400px; padding: 40px;">
            <h2 class="auth-title">Bem-vindo de volta</h2>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <label for="username" style="display:block; margin-bottom:5px; color:#666;">Usuário</label>
                <input type="text" id="username" name="username" placeholder="Seu usuário" required>
                
                <label for="password" style="display:block; margin-bottom:5px; color:#666;">Senha</label>
                <input type="password" id="password" name="password" placeholder="Sua senha" required>
                
                <button type="submit" style="width: 100%; margin-top: 10px;">Entrar</button>
            </form>

            <a href="{{ url_for('register') }}" class="auth-link">Não tem uma conta? Crie agora</a>
        </div>
    </div>

</body>
</html>
