<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Post - Meu Diário</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    
    <header class="top-bar">
        <div class="logo">📒 Chronicle Clone</div>
        <div class="user-menu">
            <span>Olá, {{ current_user.username }}</span>
            <a href="{{ url_for('logout') }}" class="btn-logout">Sair</a>
        </div>
    </header>

    <div class="auth-wrapper" style="min-height: 80vh; justify-content: flex-start; padding-top: 50px;">
        
        <div class="new-post-card" style="width: 100%; max-width: 600px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="margin: 0;">✏️ Editar Post</h2>
                <a href="{{ url_for('dashboard') }}" class="btn-small">Cancelar</a>
            </div>

            <form action="{{ url_for('edit_post', post_id=post.idPost) }}" method="POST">
                <textarea name="content" rows="10" 
                          style="width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; font-size: 1.1rem; resize: vertical;" 
                          required>{{ post.content }}</textarea>
                
                <div style="margin-top: 20px; text-align: right;">
                    <button type="submit">Salvar Alterações</button>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
